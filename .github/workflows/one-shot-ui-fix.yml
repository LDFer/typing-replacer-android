name: One-shot UI compile fix

on:
  push:
    branches:
      - universal-ime-fallback
    paths:
      - .github/workflows/one-shot-ui-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: universal-ime-fallback
          fetch-depth: 0
      - name: Fix EditText single line calls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/typingreplacer/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          if s.count('singleLine = true') != 2:
              raise SystemExit('expected two singleLine assignments')
          p.write_text(s.replace('singleLine = true', 'setSingleLine(true)'), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/typingreplacer/MainActivity.kt
          git commit -m 'Fix TextFlow single-line inputs'
          git push origin HEAD:universal-ime-fallback
